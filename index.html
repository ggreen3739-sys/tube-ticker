<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tube Ticker">
<title>Tube Ticker</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#1a1a1a;overflow-x:hidden}
.app{max-width:600px;margin:0 auto;background:#fff;min-height:100vh;position:relative}

/* Header */
.header{background:#fff;border-bottom:1px solid #e5e5e5;padding:14px 16px;position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px}
.menu-btn{width:36px;height:36px;display:flex;flex-direction:column;justify-content:center;gap:5px;cursor:pointer;flex-shrink:0;padding:4px}
.menu-btn span{display:block;height:2px;background:#1a1a1a;border-radius:1px;transition:all .25s}
.header-title{font-size:18px;font-weight:700;flex:1}
.save-badge{font-size:11px;background:#f0fdf4;color:#16a34a;padding:3px 8px;border-radius:6px;font-weight:500;flex-shrink:0}

/* Side menu overlay */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0);pointer-events:none;z-index:100;transition:background .25s}
.overlay.open{background:rgba(0,0,0,0.4);pointer-events:all}
.sidemenu{position:fixed;top:0;left:-280px;width:280px;height:100%;background:#fff;z-index:101;transition:left .25s cubic-bezier(.4,0,.2,1);overflow-y:auto;box-shadow:4px 0 20px rgba(0,0,0,0.08)}
.sidemenu.open{left:0}
.sidemenu-header{padding:20px 20px 16px;border-bottom:1px solid #f0f0f0}
.sidemenu-title{font-size:20px;font-weight:700}
.sidemenu-subtitle{font-size:12px;color:#888;margin-top:2px}
.nav-section{padding:8px 0}
.nav-section-label{font-size:11px;font-weight:600;color:#aaa;text-transform:uppercase;letter-spacing:.6px;padding:8px 20px 4px}
.nav-item{display:flex;align-items:center;gap:12px;padding:12px 20px;cursor:pointer;transition:background .15s}
.nav-item:active{background:#f5f5f5}
.nav-item.active{background:#f0f9ff}
.nav-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.nav-item-text{font-size:15px;font-weight:500;color:#1a1a1a}
.nav-item.active .nav-item-text{color:#0098D4}
.nav-arrow{margin-left:auto;color:#ccc;font-size:12px}
.nav-divider{height:1px;background:#f0f0f0;margin:4px 0}

/* Content area */
.content{padding:0}
.page{display:none}
.page.active{display:block}

/* Home page */
.home-content{padding:24px 16px}
.home-hero{text-align:center;padding:32px 16px 24px}
.home-hero-icon{font-size:48px;margin-bottom:12px}
.home-hero-title{font-size:26px;font-weight:700;margin-bottom:6px}
.home-hero-sub{font-size:14px;color:#888}
.home-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.home-stat-card{background:#f5f5f5;border-radius:14px;padding:16px}
.home-stat-line{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.home-stat-dot{width:10px;height:10px;border-radius:50%}
.home-stat-name{font-size:13px;font-weight:600;color:#1a1a1a}
.home-stat-val{font-size:22px;font-weight:700;color:#1a1a1a}
.home-stat-lbl{font-size:11px;color:#888;margin-top:2px}
.home-bar-bg{height:4px;background:#e5e5e5;border-radius:2px;overflow:hidden;margin-top:8px}
.home-bar-fill{height:100%;border-radius:2px;transition:width .4s}

/* Line list page */
.line-list{padding:12px 0}
.line-list-item{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer;border-bottom:1px solid #f5f5f5;transition:background .15s}
.line-list-item:active{background:#fafafa}
.line-list-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0}
.line-list-info{flex:1}
.line-list-name{font-size:16px;font-weight:600;color:#1a1a1a}
.line-list-sub{font-size:12px;color:#888;margin-top:2px}
.line-list-pct{font-size:13px;font-weight:600;margin-right:8px}
.line-list-chevron{color:#ccc;font-size:14px}
.line-bar-bg{height:3px;background:#eee;border-radius:2px;overflow:hidden;margin-top:6px}
.line-bar-fill{height:100%;border-radius:2px}

/* Back button / sub-page header */
.sub-header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #eee;position:sticky;top:57px;background:#fff;z-index:40}
.back-btn{display:flex;align-items:center;gap:4px;font-size:14px;font-weight:500;color:#0098D4;cursor:pointer;padding:4px 0}
.sub-header-title{font-size:16px;font-weight:700;flex:1;text-align:center}
.sub-header-spacer{width:60px}

/* Trains detail */
.trains-content{padding:14px 16px}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat-card{background:#f5f5f5;border-radius:10px;padding:10px 12px}
.stat-val{font-size:17px;font-weight:600;color:#1a1a1a}
.stat-lbl{font-size:10px;color:#888;margin-top:2px}
.progress-bar-bg{height:5px;background:#e5e5e5;border-radius:3px;overflow:hidden;margin-bottom:4px}
.progress-bar-fill{height:100%;border-radius:3px;transition:width .4s}
.prog-lbl{font-size:11px;color:#888;margin-bottom:12px}
.quickadd-wrap{display:flex;gap:8px;margin-bottom:6px}
.quickadd-input{flex:1;font-size:16px;padding:0 14px;height:46px;border-radius:12px;border:1.5px solid #ddd;background:#fff;color:#1a1a1a;-webkit-appearance:none;transition:border-color .15s}
.quickadd-input:focus{outline:none;border-color:#555}
.quickadd-btn{height:46px;padding:0 20px;font-size:15px;font-weight:600;border-radius:12px;border:none;color:#fff;cursor:pointer;flex-shrink:0}
.quickadd-btn:active{opacity:.8}
.feedback{font-size:13px;min-height:18px;margin-bottom:10px;font-weight:500}
.feedback.ok{color:#16a34a}
.feedback.err{color:#dc2626}
.filter-row{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filter-row::-webkit-scrollbar{display:none}
.search-input{font-size:14px;padding:6px 10px;height:32px;border-radius:8px;border:1px solid #ddd;color:#1a1a1a;width:110px;flex-shrink:0}
.filter-btn{font-size:12px;padding:0 12px;height:32px;border-radius:16px;border:1px solid #ddd;background:#fff;color:#888;cursor:pointer;white-space:nowrap;flex-shrink:0;font-weight:500}
.section-label{font-size:11px;font-weight:600;color:#aaa;text-transform:uppercase;letter-spacing:.5px;margin:14px 0 8px;padding-bottom:6px;border-bottom:1px solid #eee}
.train-card{background:#fff;border:1px solid #eee;border-radius:14px;margin-bottom:8px;overflow:hidden}
.train-header{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;user-select:none}
.train-header:active{background:#fafafa}
.line-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.train-label{font-size:14px;font-weight:600;color:#1a1a1a;flex:1}
.train-count{font-size:13px;color:#888;flex-shrink:0}
.tick-all{width:30px;height:30px;border-radius:8px;border:1.5px solid #ddd;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;background:#fff}
.tick-all:active{transform:scale(.92)}
.cars-wrap{padding:0 14px 14px;border-top:1px solid #f0f0f0}
.train-diagram{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:10px 0 2px}
.train-diagram::-webkit-scrollbar{display:none}
.car{flex-shrink:0;width:54px;border:1.5px solid #eee;border-radius:8px;padding:8px 3px 6px;text-align:center;cursor:pointer;background:#fff}
.car:active{transform:scale(.95)}
.car-num{font-size:11px;font-weight:600;color:#1a1a1a}
.coming-soon{font-size:13px;color:#aaa;padding:16px;background:#fafafa;border-radius:12px;text-align:center;margin-top:8px;border:1px dashed #e5e5e5}

/* Stations */
.stations-content{padding:0}
.station-item{display:flex;align-items:center;padding:13px 16px;border-bottom:1px solid #f5f5f5}
.station-name{font-size:15px;font-weight:500;color:#1a1a1a;flex:1}
.station-tasks{display:flex;gap:6px}
.task-group{display:flex;flex-direction:column;align-items:center;gap:3px}
.task-chk{width:28px;height:28px;border-radius:7px;border:1.5px solid #ddd;display:flex;align-items:center;justify-content:center;cursor:pointer;background:#fff;transition:all .15s;flex-shrink:0}
.task-chk:active{transform:scale(.9)}
.task-chk.on{border-color:transparent}
.task-lbl{font-size:9px;color:#aaa;text-align:center;line-height:1.2;max-width:28px}
.station-progress{font-size:11px;font-weight:600;margin-right:8px;flex-shrink:0}
.stations-header-row{display:flex;align-items:center;padding:8px 16px;background:#fafafa;border-bottom:1px solid #eee;position:sticky;top:107px;z-index:30}
.stations-header-name{font-size:11px;font-weight:600;color:#aaa;text-transform:uppercase;letter-spacing:.5px;flex:1}
.stations-header-tasks{display:flex;gap:6px}
.stations-header-task{font-size:9px;color:#aaa;text-align:center;width:28px;line-height:1.2}

@media(prefers-color-scheme:dark){
  body{background:#111;color:#f0f0f0}
  .app{background:#1a1a1a}
  .header{background:#1a1a1a;border-bottom-color:#333}
  .menu-btn span{background:#f0f0f0}
  .sidemenu{background:#1a1a1a}
  .sidemenu-header{border-bottom-color:#333}
  .nav-item:active{background:#252525}
  .nav-item.active{background:#0d2137}
  .nav-divider{background:#333}
  .stat-card,.home-stat-card{background:#252525}
  .stat-val,.home-stat-val,.home-stat-name,.home-hero-title{color:#f0f0f0}
  .progress-bar-bg,.home-bar-bg{background:#333}
  .quickadd-input,.search-input{background:#252525;border-color:#444;color:#f0f0f0}
  .filter-btn{background:#252525;border-color:#444;color:#aaa}
  .train-card{background:#1a1a1a;border-color:#333}
  .train-header:active{background:#252525}
  .train-label,.car-num,.station-name,.line-list-name{color:#f0f0f0}
  .tick-all,.car,.task-chk{background:#252525;border-color:#444}
  .cars-wrap{border-top-color:#2a2a2a}
  .line-list-item{border-bottom-color:#2a2a2a}
  .line-list-item:active{background:#222}
  .station-item{border-bottom-color:#2a2a2a}
  .stations-header-row{background:#222;border-bottom-color:#333}
  .coming-soon{background:#222;border-color:#333}
  .sub-header{background:#1a1a1a;border-bottom-color:#333}
  .home-bar-bg{background:#333}
  .line-bar-bg{background:#333}
  .section-label{border-bottom-color:#333}
}
</style>
</head>

        <div class="nav-item-text">Home</div>
      </div>

    <div class="nav-divider"></div>
    <div class="nav-section">
      <div class="nav-section-label">Trains</div>
      <div id="trains-nav"></div>
    </div>
    <div class="nav-divider"></div>
    <div class="nav-section">
      <div class="nav-section-label">Stations</div>
      <div id="stations-nav"></div>
    </div>
  </div>

  <!-- Pages -->
  <div id="page-home" class="page active">
    <div class="home-content">
      <div class="home-hero">
        <div class="home-hero-icon">🚇</div>
        <div class="home-hero-title">Tube Ticker</div>
        <div class="home-hero-sub">Track every car on the London Underground</div>
      </div>
      <div class="home-stats" id="home-stats"></div>

  </div>

  <div id="page-trains" class="page">

  <div id="page-train-detail" class="page">

        <div class="stat-card"><div class="stat-val" id="s-cars">0</div><div class="stat-lbl">Cars complete</div></div>
        <div class="stat-card"><div class="stat-val" id="s-pct">0%</div><div class="stat-lbl">Fleet done</div></div>
      </div>
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="prog" style="width:0%"></div></div>
      <div class="prog-lbl" id="prog-lbl"></div>
      <div class="quickadd-wrap">
        <input class="quickadd-input" id="qaInput" type="number" inputmode="numeric" pattern="[0-9]*" placeholder="Car number..."
          oninput="if(this.value.length>6)this.value=this.value.slice(0,6)"
          onkeydown="if(event.key==='Enter')doQuickAdd()">
        <button class="quickadd-btn" id="qaBtn" onclick="doQuickAdd()">Tick it</button>
      </div>
      <div class="feedback" id="qaFeedback"></div>
      <div class="filter-row">
        <input type="text" class="search-input" id="search" placeholder="Search..." oninput="renderTrains()">
        <button class="filter-btn" data-filter="all" onclick="setFilter('all',this)">All</button>
        <button class="filter-btn" data-filter="done" onclick="setFilter('done',this)">Complete</button>
        <button class="filter-btn" data-filter="partial" onclick="setFilter('partial',this)">Partial</button>
        <button class="filter-btn" data-filter="none" onclick="setFilter('none',this)">Unticked</button>
      </div>
      <div id="train-list"></div>
    </div>
  </div>

  <div id="page-stations" class="page">
    <div class="line-list" id="stations-line-list"></div>
  </div>

  <div id="page-station-detail" class="page">
    <div class="sub-header">
      <div class="back-btn" onclick="navTo('stations')">‹ Lines</div>
      <div class="sub-header-title" id="station-detail-title"></div>
      <div class="sub-header-spacer"></div>
    </div>
    <div class="stations-header-row">
      <div class="stations-header-name">Station</div><div id="station-pct-header" style="font-size:11px;font-weight:600;margin-right:8px;color:#aaa">0%</div>
      <div class="stations-header-tasks">

        <div class="stations-header-task">Used plat</div>
        <div class="stations-header-task">Entrance</div>
        <div class="stations-header-task">Changed</div>
      </div>
    </div>
    <div class="stations-content" id="station-list"></div>
  </div>

</div>

// ── TASK DEFINITIONS ──────────────────────────────────────────────────────────
const TASK_KEYS=['thru','plat','entr','chng'];
const TASK_COLORS=['#4CAF50','#2196F3','#FF9800','#9C27B0'];

// ── STATE ─────────────────────────────────────────────────────────────────────
const tickedData={};   // trains
const stationData={};  // stations
const expandedData={};
const carMaps={};

Object.keys(LINES).forEach(k=>{
  tickedData[k]=new Map();
  expandedData[k]=new Set();
  stationData[k]={};
  LINES[k].stations.forEach(s=>{stationData[k][s]={thru:false,plat:false,entr:false,chng:false};});
  const m=new Map();
  LINES[k].sections.forEach((sec,si)=>sec.trains.forEach((t,ti)=>t.forEach((cn,ci)=>m.set(cn,{si,ti,ci}))));
  carMaps[k]=m;
});

let activeLine='victoria';
let activeFilter='all';
let currentPage='home';
let fbTimer=null;

// ── LOCAL STORAGE ─────────────────────────────────────────────────────────────
const SK='tube-ticker-v2';
function save(){
  try{
    const d={trains:{},stations:{}};
    Object.keys(tickedData).forEach(k=>{
      d.trains[k]={};
      tickedData[k].forEach((v,key)=>d.trains[k][key]=[...v]);
      d.stations[k]=stationData[k];
    });
    localStorage.setItem(SK,JSON.stringify(d));
    const b=document.getElementById('save-badge');
    b.textContent='● Saved';b.style.color='#16a34a';
  }catch(e){}
}
function load(){
  try{
    const raw=localStorage.getItem(SK);
    if(!raw)return;
    const d=JSON.parse(raw);
    if(d.trains)Object.keys(d.trains).forEach(k=>{
      if(!tickedData[k])return;
      Object.entries(d.trains[k]).forEach(([key,arr])=>tickedData[k].set(key,new Set(arr)));
    });
    if(d.stations)Object.keys(d.stations).forEach(k=>{
      if(!stationData[k])return;
      Object.assign(stationData[k],d.stations[k]);
    });
  }catch(e){}
}

// ── HELPERS ───────────────────────────────────────────────────────────────────
const trainKey=(si,ti)=>si+'-'+ti;
const trainLen=(lk,si,ti)=>LINES[lk].sections[si].trains[ti].length;
function getStatus(lk,si,ti){const t=tickedData[lk].get(trainKey(si,ti))||new Set(),len=trainLen(lk,si,ti);return t.size===0?'none':t.size===len?'done':'partial';}
function totalCars(lk){return LINES[lk].sections.reduce((s,sec)=>s+sec.trains.reduce((ss,t)=>ss+t.length,0),0);}
function totalTrains(lk){return LINES[lk].sections.reduce((s,sec)=>s+sec.trains.length,0);}
function lineCarsSpotted(lk){let c=0;LINES[lk].sections.forEach((sec,si)=>sec.trains.forEach((t,ti)=>{const tk=tickedData[lk].get(trainKey(si,ti))||new Set();c+=tk.size;}));return c;}
function lineTrainsComplete(lk){let c=0;LINES[lk].sections.forEach((sec,si)=>sec.trains.forEach((t,ti)=>{const tk=tickedData[lk].get(trainKey(si,ti))||new Set();if(tk.size===t.length)c++;}));return c;}
function lineStationPct(lk){
  const isAll=lk==='all';
  const stations=isAll?ALL_STATIONS:LINES[lk].stations;
  const data=isAll?stationDataAll:stationData[lk];
  const total=stations.length*4;let done=0;
  stations.forEach(s=>{if(data[s])TASK_KEYS.forEach(k=>{if(data[s][k])done++;});});
  return total>0?(done/total*100).toFixed(1):'0.0';
}

// ── NAVIGATION ────────────────────────────────────────────────────────────────
function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  currentPage=id;
}

function navTo(dest,lineKey){
  closeMenu();
  if(dest==='home'){
    document.getElementById('headerTitle').textContent='🚇 Tube Ticker';
    renderHome();
    showPage('home');
  } else if(dest==='trains'){
    document.getElementById('headerTitle').textContent='Trains';
    renderTrainsList();
    showPage('trains');
  } else if(dest==='train-detail'){
    activeLine=lineKey;
    document.getElementById('headerTitle').textContent=LINES[lineKey].name;
    document.getElementById('train-detail-title').textContent=LINES[lineKey].name;
    document.getElementById('qaBtn').style.background=LINES[lineKey].color;
    activeFilter='all';
    document.getElementById('search').value='';
    styleFilterBtns();
    updateTrainStats();
    renderTrains();
    showPage('train-detail');
  } else if(dest==='stations'){
    document.getElementById('headerTitle').textContent='Stations';
    renderStationsList();
    showPage('stations');
  } else if(dest==='station-detail'){
    activeLine=lineKey;
    document.getElementById('headerTitle').textContent=LINES[lineKey].name+' Stations';
    document.getElementById('station-detail-title').textContent=LINES[lineKey].name;
    renderStations();
    showPage('station-detail');
  }
  updateNavHighlight(dest,lineKey);
}

function updateNavHighlight(dest,lineKey){
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  if(dest==='home')document.getElementById('nav-home').classList.add('active');
  else if(lineKey)document.getElementById('nav-'+dest.split('-')[0]+'-'+lineKey)?.classList.add('active');
}

// ── MENU ──────────────────────────────────────────────────────────────────────
function toggleMenu(){document.getElementById('sidemenu').classList.toggle('open');document.getElementById('overlay').classList.toggle('open');}
function closeMenu(){document.getElementById('sidemenu').classList.remove('open');document.getElementById('overlay').classList.remove('open');}

// ── HOME ──────────────────────────────────────────────────────────────────────
function renderHome(){
  const c=document.getElementById('home-stats');
  c.innerHTML='';
  Object.entries(LINES).forEach(([k,line])=>{
    const cars=lineCarsSpotted(k),tot=totalCars(k),pct=(cars/tot*100).toFixed(1);
    const div=document.createElement('div');
    div.className='home-stat-card';
    div.style.cursor='pointer';
    div.onclick=()=>navTo('train-detail',k);
    div.innerHTML=`<div class="home-stat-line"><div class="home-stat-dot" style="background:${line.color}"></div><div class="home-stat-name">${line.name}</div></div>
    <div class="home-stat-val">${pct}%</div>
    <div class="home-stat-lbl">${cars}/${tot} cars</div>
    <div class="home-bar-bg"><div class="home-bar-fill" style="width:${pct}%;background:${line.color}"></div></div>`;
    c.appendChild(div);
  });
}

// ── TRAINS LIST ───────────────────────────────────────────────────────────────
function renderTrainsList(){
  const c=document.getElementById('trains-line-list');
  c.innerHTML='';
  Object.entries(LINES).forEach(([k,line])=>{
    const cars=lineCarsSpotted(k),tot=totalCars(k),pct=(cars/tot*100).toFixed(1);
    const div=document.createElement('div');
    div.className='line-list-item';
    div.onclick=()=>navTo('train-detail',k);
    div.innerHTML=`<div class="line-list-dot" style="background:${line.color}"></div>
    <div class="line-list-info">
      <div class="line-list-name">${line.name}</div>
      <div class="line-list-sub">${totalTrains(k)} trains · ${tot} cars</div>
      <div class="line-bar-bg"><div class="line-bar-fill" style="width:${pct}%;background:${line.color}"></div></div>
    </div>
    <div class="line-list-pct" style="color:${line.color}">${pct}%</div>
    <div class="line-list-chevron">›</div>`;
    c.appendChild(div);
  });
}

// ── TRAINS DETAIL ─────────────────────────────────────────────────────────────
function updateTrainStats(){
  const lk=activeLine,line=LINES[lk];
  const cars=lineCarsSpotted(lk),tot=totalCars(lk),trains=lineTrainsComplete(lk),totT=totalTrains(lk);
  const pct=(cars/tot*100).toFixed(1);
  document.getElementById('s-trains').textContent=trains+'/'+totT;
  document.getElementById('s-cars').textContent=cars+'/'+tot;
  document.getElementById('s-pct').textContent=pct+'%';
  document.getElementById('prog').style.width=pct+'%';
  document.getElementById('prog').style.background=line.color;
  document.getElementById('prog-lbl').textContent=cars+' of '+tot+' cars · '+trains+' of '+totT+' trains complete';
}

function styleFilterBtns(){
  const col=LINES[activeLine].color;
  document.querySelectorAll('.filter-btn').forEach(b=>{b.style.background='';b.style.borderColor='';b.style.color='';});
  const ab=document.querySelector('[data-filter="'+activeFilter+'"]');
  if(ab){ab.style.background=col;ab.style.borderColor=col;ab.style.color='#fff';}
}

function setFilter(f,btn){
  activeFilter=f;styleFilterBtns();renderTrains();
}

function doQuickAdd(){
  const val=document.getElementById('qaInput').value.trim();
  if(!val){setFb('Enter a car number first','err');return;}
  const found=carMaps[activeLine].get(val);
  if(!found){setFb(val+' not found on this line','err');return;}
  const{si,ti,ci}=found,key=trainKey(si,ti);
  if(!tickedData[activeLine].has(key))tickedData[activeLine].set(key,new Set());
  const t=tickedData[activeLine].get(key);
  if(t.has(ci)){setFb(val+' already ticked!','err');}
  else{t.add(ci);setFb('Ticked '+val+' 🚇','ok');updateTrainStats();renderTrains();save();}
  document.getElementById('qaInput').value='';
}

function setFb(msg,type){
  const el=document.getElementById('qaFeedback');
  el.textContent=msg;el.className='feedback '+type;
  if(fbTimer)clearTimeout(fbTimer);
  fbTimer=setTimeout(()=>{el.textContent='';el.className='feedback';},3000);
}

function renderTrains(){
  const q=(document.getElementById('search').value||'').trim(),lk=activeLine,line=LINES[lk],data=tickedData[lk],list=document.getElementById('train-list');
  list.innerHTML='';
  line.sections.forEach((sec,si)=>{
    if(sec.label){const lbl=document.createElement('div');lbl.className='section-label';lbl.textContent=sec.label;list.appendChild(lbl);}
    sec.trains.forEach((cars,ti)=>{
      const key=trainKey(si,ti),status=getStatus(lk,si,ti);
      if(activeFilter==='done'&&status!=='done')return;
      if(activeFilter==='partial'&&status!=='partial')return;
      if(activeFilter==='none'&&status!=='none')return;
      if(q&&!cars.some(c=>c.includes(q)))return;
      const ticked=data.get(key)||new Set(),isExp=expandedData[lk].has(key),col=line.color;
      const card=document.createElement('div');card.className='train-card';
      if(status==='done')card.style.borderColor=col;
      else if(status==='partial')card.style.borderColor=col+'88';
      const tickInner=status==='done'?`<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8L6.5 12L13 4" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`:'';
      const tickStyle=status==='done'?`background:${col};border-color:${col}`:status==='partial'?`border-color:${col}`:'';
      card.innerHTML=`<div class="train-header" onclick="toggleExp('${lk}','${key}')">
        <div class="line-dot" style="background:${col}"></div>
        <div class="train-label">${cars[0]} – ${cars[cars.length-1]}</div>
        <div class="train-count">${ticked.size}/${cars.length}</div>
        <div class="tick-all" style="${tickStyle}" onclick="tickAll(event,'${lk}','${key}',${cars.length})">${tickInner}</div>
      </div>`;
      if(isExp){
        const wrap=document.createElement('div');wrap.className='cars-wrap';
        const diag=document.createElement('div');diag.className='train-diagram';
        cars.forEach((cn,ci)=>{
          const isTicked=ticked.has(ci);
          const car=document.createElement('div');car.className='car';
          car.style.borderColor=isTicked?col:'';car.style.background=isTicked?col+'22':'';
          car.innerHTML=`<div class="car-num" style="color:${isTicked?line.colorDark:''}">${cn}</div>`;
          car.onclick=()=>{if(!data.has(key))data.set(key,new Set());const t=data.get(key);t.has(ci)?t.delete(ci):t.add(ci);updateTrainStats();renderTrains();save();};
          diag.appendChild(car);
        });
        wrap.appendChild(diag);card.appendChild(wrap);
      }
      list.appendChild(card);
    });
  });
}

function toggleExp(lk,key){if(expandedData[lk].has(key))expandedData[lk].delete(key);else expandedData[lk].add(key);renderTrains();}
function tickAll(e,lk,key,len){
  e.stopPropagation();
  const t=tickedData[lk].get(key)||new Set();
  tickedData[lk].set(key,t.size===len?new Set():new Set([...Array(len).keys()]));
  updateTrainStats();renderTrains();save();
}

// ── STATIONS LIST ─────────────────────────────────────────────────────────────
function renderStationsList(){
  const c=document.getElementById('stations-line-list');
  c.innerHTML='';
  Object.entries(LINES).forEach(([k,line])=>{
    const{done,total}=lineStationTasks(k),pct=total>0?(done/total*100).toFixed(1):'0.0';
    const div=document.createElement('div');
    div.className='line-list-item';
    div.onclick=()=>navTo('station-detail',k);
    div.innerHTML=`<div class="line-list-dot" style="background:${line.color}"></div>
    <div class="line-list-info">
      <div class="line-list-name">${line.name}</div>
      <div class="line-list-sub">${LINES[k].stations.length} stations · ${total} tasks</div>
      <div class="line-bar-bg"><div class="line-bar-fill" style="width:${pct}%;background:${line.color}"></div></div>
    </div>
    <div class="line-list-pct" style="color:${line.color}">${pct}%</div>
    <div class="line-list-chevron">›</div>`;
    c.appendChild(div);
  });
}

// ── STATIONS DETAIL ───────────────────────────────────────────────────────────
function renderStations(){
  const lk=activeLine,line=LINES[lk],list=document.getElementById('station-list');
  list.innerHTML='';
  LINES[lk].stations.forEach(st=>{
    const d=stationData[lk][st]||{thru:false,plat:false,entr:false,chng:false};
    const done=TASK_KEYS.filter(k=>d[k]).length;
    const row=document.createElement('div');
    row.className='station-item';
    const tasksHtml=TASK_KEYS.map((k,i)=>`
      <div class="task-chk${d[k]?' on':''}" style="${d[k]?'background:'+TASK_COLORS[i]+';':'border-color:'+TASK_COLORS[i]+'44'}" onclick="tickTask('${lk}','${st.replace(/'/g,"\\'")}','${k}')">
        ${d[k]?`<svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M2.5 6.5L5.2 9.5L10.5 3.5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`:''}
      </div>`).join('');
    row.innerHTML=`<div class="station-name">${st}</div>
    <div class="station-progress" style="color:${done===4?line.color:'#aaa'}">${done}/4</div>
    <div class="station-tasks">${tasksHtml}</div>`;
    list.appendChild(row);
  });
}

function tickTask(lk,st,key){
  const isAll=lk==='all';
  const data=isAll?stationDataAll:stationData[lk];
  if(!data[st])data[st]={thru:false,plat:false,entr:false,chng:false};
  data[st][key]=!data[st][key];
  renderStations();save();
}

// ── BUILD SIDE MENU NAV ───────────────────────────────────────────────────────
function buildNav(){
  const tNav=document.getElementById('trains-nav');
  const sNav=document.getElementById('stations-nav');
  Object.entries(LINES).forEach(([k,line])=>{
    const cars=lineCarsSpotted(k),tot=totalCars(k),pct=(cars/tot*100).toFixed(1);
    const ti=document.createElement('div');
    ti.className='nav-item';ti.id='nav-trains-'+k;
    ti.innerHTML=`<div class="nav-dot" style="background:${line.color}"></div><div class="nav-item-text">${line.name}</div><div class="nav-arrow">${pct}%</div>`;
    ti.onclick=()=>navTo('train-detail',k);
    tNav.appendChild(ti);

    const si=document.createElement('div');
    si.className='nav-item';si.id='nav-stations-'+k;
    si.innerHTML=`<div class="nav-dot" style="background:${line.color}"></div><div class="nav-item-text">${line.name}</div><div class="nav-arrow">›</div>`;
    si.onclick=()=>navTo('station-detail',k);
    sNav.appendChild(si);
  });
}

// ── INIT ──────────────────────────────────────────────────────────────────────
load();
buildNav();
renderHome();
styleFilterBtns();
</script>
</body>
</html>
